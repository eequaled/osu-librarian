name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: python tests
        run: python3 -m unittest discover -s tests
      - name: python tests are node-complete (no silent skips)
        run: python3 -m unittest tests.test_store_node -v
      - name: relay tests
        run: python3 -m unittest discover -s relay
      - name: web syntax
        run: sh scripts/check-web.sh
